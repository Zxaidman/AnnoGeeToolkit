title: "Filter\nView Manager"
author: AnonGee
tooltip: |
  Saved, rule-based views. Build a rule down Category > Family > Type >
  Parameter, name it, and pressing it shows only what the rule matches in the
  active view.

  What pressing a rule does
    • Temporarily isolates the matches, in the ACTIVE VIEW only.
    • Writes NOTHING to the project. No view filter is created, nothing
      appears in Manage > Filters, and a colleague opening the model sees no
      trace that the tool was used.
    • Lasts the Revit session. It does not print and does not survive a
      save. Clear puts the view back, and so does Revit's own Reset Temporary
      Hide/Isolate.

  The layout
    • Three columns, in the same order as Revit's own Filters dialog:
      Saved rules | Categories | Filter rules. The SHAPE is Revit's so
      you already know where to look; everything in it is ours.
    • Each filter rule is a row you edit in place - parameter, compare,
      value, unit - with its own remove button, like Revit's.
    • Click a row to tick it, click again to untick. Ctrl+click adds,
      Shift+click takes a run. Both lists behave the same way.
    • Check all / Check none act on what is SHOWN, so with a search in
      the box that is the search results and not all 137 categories.

  Building a rule
    • Tick one or more categories. Family and Type are optional — leave them
      on "any" and the rule matches everything in those categories.
    • Family and Type live under the Categories column. Revit's dialog has
      no equivalent; ours is worth keeping, and it answers the same
      question - what the rule looks in.
    • Basic Wall is a system family and appears in the Family list exactly
      like a loadable one.
    • Add parameter conditions, combined with All or Any. Every parameter the
      categories carry is offered; the ones Revit would refuse in a native view
      filter are marked "(no view filter)" and still work here, because
      pressing a rule isolates rather than filtering.
    • A value is stored in the unit you typed it in, so "Area > 100 m²" still
      means 100 m² on an imperial project.
    • A rule with no conditions matches everything in its cascade, which is a
      legitimate rule — "all the structural columns".

  Where rules live — you choose, per rule
    • THIS WORKSTATION (the default)
      %APPDATA%/Zxaidman/AnonGee/BIM-Toolkit/filter_view_rules.json. The
      rule follows YOU into every project on this machine and survives a
      Revit restart. Nobody else gets it.
    • THIS PROJECT
      <model folder>/AnonGee/filter_view_rules.json. The rule travels with
      the MODEL, so anyone who opens it gets the same rule. Use it for the
      views a job needs rather than the ones you always use.
    • SHARED
      One file the whole office points at, usually on a network drive.
      Press Choose and pick the same file everybody else picks; the first
      person to save creates it. Everyone reads and writes the one set.
    • Change 'Saved in' and press Save rule and the rule MOVES — written
      to one store, removed from the other. It is never in both by
      accident.
    • A model that has never been saved has no folder to put a file in, so
      'This project' is greyed until you save it and press Re-read model.
    • The same name in both stores gives two rules, each badged. Neither
      wins and neither is hidden — they are different rules that happen to
      share a label.
    • The dockable panel shows both, once you have pressed one of its
      buttons or Refresh: a panel has no document of its own, so that trip
      is how it learns where the model keeps its rules.
    • A rule stores NAMES, never element ids — ids do not survive a session,
      let alone another project.
    • A rule whose type this project does not have is greyed and says what it
      could not find. It is never deleted or rewritten.

  Choosing rules
    • Click a rule to load it into the editor — name, categories,
      family, type and every condition, as it was saved.
    • Ctrl+click adds to the selection; Shift+click takes a run of them —
      the same gestures as cad2bim's layer mapping. The tick on the left
      shows what is selected; it is a report, not a second switch.
    • Duplicate, Delete and the four Move buttons act on EVERYTHING
      selected. Move up/down shift the block one place; To top and To
      bottom send it straight to either end, keeping its own order.
    • The editor holds one rule, so it loads only when exactly one is
      selected — picking several never discards what you were editing.

  Buttons
    Count        how many elements match, changing nothing
    Select       push the matches into Revit's selection
    Apply        isolate them in the ACTIVE view
    Views...     isolate them in SEVERAL views at once. Views that cannot
                 take it are listed with the reason rather than hidden,
                 and ONE Undo puts every view back.
    Make filter  create a REAL Revit view filter in Manage > Filters.
                 The ONLY thing here that writes to the project - you are
                 shown exactly what will be created and asked first, and
                 you can change the name before it is. A family or type
                 narrowing converts too: it becomes Family Name and Type
                 Name rules, which is how Revit expresses the same thing.
    Clear        put the view back
    Diagnostics  what the tool has done and anything that failed, with
                 the full detail, and it opens the folder the log is in

  The live count
    • The number beside the buttons follows the rule as you build it,
      a moment after you stop changing it. It says "counting..." while
      it catches up, so a stale number never looks settled.

  Sharing a rule set
    • Export writes what is SELECTED, or all of them if nothing is.
    • Import ADDS; it never replaces. A rule arriving with a name you
      are using is brought in numbered, and the window says how many
      were renamed.

  When something goes wrong
    • Every message starts with the feature that owns it - [FEAT-11],
      [FEAT-13] - so a report can be one line. Press Diagnostics for the
      full traceback and the log file to send on.

  Notes
    • Modeless — Revit stays interactive while the window is open. Pressing
      the ribbon button again activates the open window rather than stacking a
      second one.
    • Runs on the CPython 3 engine. Every control has a tooltip.
    • The rule engine is a separate package with 155 tests on it that need no
      Revit; this window is the wiring.

  The dockable panel
    • Press Panel to show it. It docks under the ribbon as a strip of rule
      buttons, and can be dragged to either edge like Properties. It does
      NOT appear on its own when Revit starts.
    • It follows the dark surface palette — Revit's OWN grey, so it sits
      beside Properties and the Project Browser rather than punching a
      hole between them.
    • The mouse wheel scrolls whichever way the rules run: sideways in a
      top or bottom dock, down the column at either edge.
    • Docked top or bottom the rules run across and scroll sideways; docked
      left or right they stack and scroll down. It changes shape with the
      dock, so a long list is reachable either way.
    • Pressing a button there isolates that rule, the same as Apply here.
    • It is REGISTERED when Revit starts and stays hidden until you press
      Panel -- Revit allows no other order. If registration failed, Panel
      says why rather than doing nothing.
    • Press Refresh on the panel after saving a new rule: the window writes
      the rules file and the panel reads it, and they run on different
      Python engines that share a folder rather than a module.

  Version: 0.7.0
