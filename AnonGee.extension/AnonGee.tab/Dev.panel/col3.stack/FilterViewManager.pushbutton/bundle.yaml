title: "Filter\nView Manager"
author: AnonGee
tooltip: |
  Saved, rule-based views. Build a rule down Category > Family > Type >
  Parameter, name it, and it becomes a button you press to show only what the
  rule matches in the active view.

  Not built yet. This bundle is the scaffold only — pressing it says so and
  points at the documentation beside it.

  What is agreed so far
    • A rule is Category > Family > Type > Parameter conditions, e.g.
      Walls > Basic Wall > 100mm Gypsum Wall > Area > 100 m².
    • A saved rule is a named button that outlives the Revit session and
      follows the user to another project.
    • The buttons are meant to live in a dockable panel beside Properties and
      the Project Browser, not only in a dialog.

  Settled 2026-09-09
    • Saving a rule applies nothing — it adds a button to the list.
    • Pressing one TEMPORARILY ISOLATES, in the active view only. Nothing is
      written to the project; no filter appears in the project's Filters list.
    • Any parameter may be used; the ones Revit will not accept in a native
      view filter are flagged rather than hidden.
    • Rules live in %APPDATA%/Zxaidman/AnonGee/BIM-Toolkit, so they follow you
      to the next project. A per-project override is wanted, not yet specified.
    • The modeless window ships first; the dockable panel follows.

  What this button does TODAY
    It is a PROBE, not the tool. It reads the model, builds a rule from what
    it finds, says what that rule would match, and will isolate it if asked.
    It writes nothing to the project.

    It reports
      • the active view, and whether it can be isolated at all
      • both rule stores and how many rules each holds
      • every model category, then for Walls (or the first category with
        elements): its families, its types, and every parameter split into
        the ones Revit would accept in a view filter and the ones it would
        not -- which is the question CRIT-2 has never had answered in a model
      • the rule it built, what it resolves to, and how many elements match
      • your own saved rules, checked against THIS model

    The full report is written to a file and printed to the pyRevit console,
    so it can be pasted rather than retyped.

  Built so far
    • The rule engine, whole: the rule model, value parsing, operators, units,
      the JSON stores, the model queries and the isolate. 155 tests, none of
      which need Revit.
    • It lives in lib/anongee_filterrules, not beside this script, because the
      dockable panel is registered from startup.py on IronPython and lib/ is
      the only folder both engines can import from.

  Not built yet
    The modeless window -- the cascade picker, the live count, save and the
    rule buttons. That is 0.1.0.

  Read before building
    METHODOLOGY.md   how this repository works and what this tool must obey
    todo-list.md     the queue, one ID per item
    CHANGELOG.md     what each build changed

  Version: 0.0.4
